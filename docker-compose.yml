# Both halves of the app. On Coolify, create a "Docker Compose" resource from this repo and set:
#   RAILS_MASTER_KEY  (runtime only, see the note at the top of Dockerfile)
#   SOLVER_KEY        any long random string; shared by web and solver
# and put GeoLite2-City.mmdb (MaxMind, free account) in the `geo` volume: without it no visitor can be
# placed, and every hunt is refused.
services:
  web:
    build: .
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SOLVER_URL: http://solver:8000
      SOLVER_KEY: ${SOLVER_KEY}
      GEOIP_CITY_DB: /data/geo/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /data/geo/GeoLite2-ASN.mmdb
    volumes:
      - storage:/rails/storage
      - geo:/data/geo:ro
    ports:
      - "3000"
    depends_on:
      solver:
        condition: service_healthy

  solver:
    build: ./sidecar
    environment:
      SOLVER_KEY: ${SOLVER_KEY}
      MAX_SESSIONS: ${MAX_SESSIONS:-8}
      SOLVER_THREADS: ${SOLVER_THREADS:-4}
    volumes:
      - dem:/data/dem
    # No published port: only the web container talks to the solver.
    expose:
      - "8000"

volumes:
  storage:
  geo:
  dem:
